<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14161d">
  <title>잿빛 매와 별의 장부</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- 타이틀 -->
    <section id="title-screen" class="screen">
      <div class="title-bg" id="title-bg"></div>
      <div class="title-inner">
        <div class="title-logo" id="title-logo">
          <div class="logo-sub">ASHEN FALCON &amp; THE STAR LEDGER</div>
          <h1>잿빛 매와 별의 장부</h1>
          <div class="logo-tag">몰락 검가의 엑스트라는 원작을 거스른다</div>
        </div>
        <nav class="title-menu" id="title-menu"></nav>
      </div>
      <div class="title-foot">클릭·탭·스페이스로 진행 · Esc 메뉴</div>
    </section>

    <!-- 스토리 -->
    <section id="story-screen" class="screen hidden">
      <div id="bg-layer" class="layer"></div>
      <div id="cg-layer" class="layer hidden"></div>
      <div id="char-layer" class="layer"></div>
      <div id="fx-layer" class="layer"></div>
      <div id="scene-caption" class="hidden"></div>
      <div id="dialog">
        <div id="name-plate" class="hidden"></div>
        <div id="dialog-text"></div>
        <div id="dialog-next">▼</div>
      </div>
      <div id="quick-menu">
        <button data-q="log" title="대사 로그 (L)">로그</button>
        <button data-q="auto" title="오토 (A)">오토</button>
        <button data-q="skip" title="읽은 대사 스킵 (Ctrl)">스킵</button>
        <button data-q="notebook" title="수첩 (N)">수첩</button>
        <button data-q="save" title="저장">저장</button>
        <button data-q="load" title="불러오기">불러오기</button>
        <button data-q="settings" title="설정">설정</button>
        <button data-q="menu" title="메뉴 (Esc)">메뉴</button>
      </div>
      <div id="choice-layer" class="hidden"></div>
    </section>

    <!-- 편성 -->
    <section id="formation-screen" class="screen hidden"></section>

    <!-- 전투 -->
    <section id="battle-screen" class="screen hidden"></section>

    <!-- 공용 오버레이 -->
    <div id="overlay" class="hidden"></div>
    <div id="toast-box"></div>
  </div>

  <!-- 코어 -->
  <script src="js/engine.js"></script>
  <script src="js/battle.js"></script>
  <!-- 데이터 (코드 수정 없이 편집 가능) -->
  <script src="data/characters.js"></script>
  <script src="data/enemies.js"></script>
  <script src="data/battles.js"></script>
  <script src="data/backgrounds.js"></script>
  <script src="data/assets.js"></script>
  <script src="data/scenario/order.js"></script>
  <script src="data/scenario/prologue.js"></script>
  <script src="data/scenario/ch1.js"></script>
  <script src="data/scenario/ch2.js"></script>
  <script src="data/scenario/ch3.js"></script>
  <script src="data/scenario/ch4.js"></script>
  <script src="data/scenario/ch5.js"></script>
  <script src="data/scenario/epilogue.js"></script>
  <!-- 엔진 -->
  <script src="js/story.js"></script>
  <script src="js/save.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/battle_ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
